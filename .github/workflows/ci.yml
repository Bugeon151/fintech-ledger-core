name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test (unit + Testcontainers integration)
        shell: bash
        run: ./gradlew build --no-daemon 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}
      - name: Report test results
        if: always()
        run: python3 .github/scripts/annotate_failures.py build-output.log build/test-results/test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

  docker:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build container image
        run: docker build -t fintech-ledger:ci .
