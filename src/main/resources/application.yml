spring:
  application:
    name: fintech-ledger

  # ── DataSource ───────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fintech_ledger}
    username: ${POSTGRES_USER:fintech}
    password: ${POSTGRES_PASSWORD:changeme_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FintechHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA ──────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ── Flyway ───────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # ── Redis ────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

  task:
    scheduling:
      pool:
        size: 4             # outbox relay, stale-claim release, reconciliation and token purge run independently

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${APP_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    context-path: /

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

# ── Idempotency ──────────────────────────────────────────────────────────────
outbox:
  publisher: ${OUTBOX_PUBLISHER:log}            # kafka | log
  topic: ${OUTBOX_TOPIC:ledger.transaction-events}
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
  max-retries: ${OUTBOX_MAX_RETRIES:8}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── OpenAPI / Swagger ────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.bugeon.fintechledger: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
